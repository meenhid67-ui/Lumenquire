let aud=null;
function obsSound(mode){
  obs.sound=mode; try{ if(aud&&aud.src){ aud.src.stop(); aud.src=null; } }catch(e){}
  if(mode!=='off'){ try{ aud=aud||{}; const AC=window.AudioContext||window.webkitAudioContext; aud.ctx=aud.ctx||new AC(); const c=aud.ctx; if(c.state==='suspended') c.resume();
    const len=c.sampleRate*4, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    if(mode==='brown'){ let last=0; for(let i=0;i<len;i++){ last=(last+.02*(Math.random()*2-1))/1.02; d[i]=last*3.5; } } else for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=c.createBufferSource(); src.buffer=buf; src.loop=true; const g=c.createGain(); g.gain.value=0; g.connect(c.destination);
    if(mode==='rain'){ const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=7000; src.connect(hp); hp.connect(lp); lp.connect(g); } else src.connect(g);
    src.start(); aud.src=src; g.gain.setTargetAtTime(mode==='rain'?.09:.3,c.currentTime,.6); }catch(e){ labToast('Sound is not available in this browser.'); obs.sound='off'; } }
  obsDrawer();
}
function obsDur(m){ const i=document.getElementById('obs-subj'); if(i) obs.subject=i.value; obs.dur=m; obsUI(); }
function obsCustom(v){ const n=Math.round(+v); if(n>=1&&n<=300){ obs.dur=n; document.querySelectorAll('.obs-durs button[data-m]').forEach(b=>b.classList.toggle('on',+b.dataset.m===n)); } }
async function obsFinish(complete){
  if(!obs.running) return; const min=obsElapsed()/6e4, S=Math.max(complete||min>=5?1:0,complete?obsStarsFor(obs.dur):Math.floor(min/10)), s=obs.subject||'General', d=todayStr(), hrs=min/60;
  obs.running=false; obs.paused=false; releaseWakeLock();
  state.hoursLog[d]=Math.round(((state.hoursLog[d]||0)+hrs)*100)/100; if(!state.subjectDayHours) state.subjectDayHours={}; const day=state.subjectDayHours[d]||(state.subjectDayHours[d]={}); day[s]=Math.round(((day[s]||0)+hrs)*100)/100;
  if(min>=1){ const e=atlasOf(s); e.min+=min; if(min>=5||complete) e.sessions++; e.stars+=S; e.last=Date.now(); (state.sessions=state.sessions||[]).push({id:uid('s'),subject:s,ts:Date.now(),min:Math.round(min*10)/10,complete:!!complete,stars:S}); }
  obs.done={subject:s,S,min:Math.max(1,Math.round(min))}; obs.tipKey=''; await saveState(); obsUI(); renderContextPanel();
}
function obsUI(){
  const el=document.getElementById('obs-ui'); if(!el) return;
  const A=atlas(), cs=Object.keys(A).filter(k=>A[k].stars>0), stars=cs.reduce((a,k)=>a+A[k].stars,0), st=document.getElementById('obs-stats');

/* ===== Final polish: rich notes, LaTeX, to-do ===== */
const SUPM={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','n':'ⁿ'};
const SUBM={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const GREEK={alpha:'α',beta:'β',gamma:'γ',delta:'δ',epsilon:'ε',theta:'θ',lambda:'λ',mu:'μ',pi:'π',rho:'ρ',sigma:'σ',tau:'τ',phi:'φ',omega:'ω',Delta:'Δ',Sigma:'Σ',Omega:'Ω',Phi:'Φ',Pi:'Π',Theta:'Θ',Lambda:'Λ'};
function texInner(t,raw){
  let s=t;
  for(let i=0;i<3;i++) s=s.replace(/\\(?:d|t)?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,(m,a,b)=>/^[\w.]+$/.test(a)&&/^[\w.]+$/.test(b)?a+'/'+b:'('+a+')/('+b+')');
  s=s.replace(/\\sqrt\s*\{([^{}]*)\}/g,'√($1)').replace(/\\(?:text|mathrm|mathbf|textbf|operatorname)\s*\{([^{}]*)\}/g,'$1')
   .replace(/\\times/g,'×').replace(/\\cdot/g,'·').replace(/\\div/g,'÷').replace(/\\pm/g,'±')
   .replace(/\\(?:leq|le|leqslant)\b/g,'≤').replace(/\\(?:geq|ge|geqslant)\b/g,'≥').replace(/\\(?:neq|ne)\b/g,'≠')
   .replace(/\\approx/g,'≈').replace(/\\(?:rightarrow|to)\b/g,'→').replace(/\\leftarrow/g,'←').replace(/\\infty/g,'∞').replace(/\\(?:degree|circ)\b/g,'°')
   .replace(/\\([A-Za-z]+)/g,(m,n)=>GREEK[n]||'').replace(/\\[,;: ]/g,' ').replace(/\\([%&#_$])/g,'$1')
   .replace(/\^\{([^{}]*)\}|\^([0-9+\-n])/g,(m,a,b)=>{ const x=a!==undefined?a:b; return [...x].every(c=>SUPM[c])?[...x].map(c=>SUPM[c]).join(''):'^('+x+')'; })
   .replace(/_\{([^{}]*)\}|_([0-9])/g,(m,a,b)=>{ const x=a!==undefined?a:b; return [...x].every(c=>SUBM[c])?[...x].map(c=>SUBM[c]).join(''):'_'+x; })
   .replace(/[{}]/g,'');
  return raw?s:s.replace(/\s{2,}/g,' ').trim();
}
function cleanMath(s){
  if(!s||!/[\\$]/.test(s)) return s;
  s=s.replace(/\\\(([\s\S]+?)\\\)/g,(m,a)=>texInner(a)).replace(/\\\[([\s\S]+?)\\\]/g,(m,a)=>texInner(a)).replace(/\$\$([\s\S]+?)\$\$/g,(m,a)=>texInner(a)).replace(/\$([^$\n]{1,120}?)\$/g,(m,a)=>/[\\^_]/.test(a)?texInner(a):m);
  if(/\\(?:d?frac|times|cdot|sqrt|div|pm|leq?|geq?|Delta|text)\b/.test(s)) s=texInner(s,true);
  return s;
}
function cleanMathDOM(el){ const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); let n; while((n=w.nextNode())){ if(/[\\$]/.test(n.nodeValue)){ const c=cleanMath(n.nodeValue); if(c!==n.nodeValue) n.nodeValue=c; } } }

const ALLOWTAG={B:'b',STRONG:'b',I:'i',EM:'i',MARK:'mark',UL:'ul',OL:'ol',LI:'li',H1:'h3',H2:'h3',H3:'h3',H4:'h3',P:'p',DIV:'p',BR:'br'};
function sanitize(html){
  const d=new DOMParser().parseFromString('<body>'+html+'</body>','text/html'), out=document.createElement('div');
  const walk=(src,dst)=>src.childNodes.forEach(n=>{
    if(n.nodeType===3){ dst.appendChild(document.createTextNode(n.nodeValue)); return; }
    if(n.nodeType!==1) return;
    let tag=ALLOWTAG[n.tagName];
    if(n.tagName==='SPAN'||n.tagName==='FONT'){ const bg=(n.style&&n.style.backgroundColor)||''; if(bg&&!/transparent|rgba\(0,\s*0,\s*0,\s*0\)/.test(bg)) tag='mark'; }
    if(tag){ const e=document.createElement(tag); if(tag!=='br') walk(n,e); dst.appendChild(e); } else walk(n,dst);
  });
  walk(d.body,out); return out.innerHTML;
}
function htmlToText(html){
  const d=document.createElement('div'); d.innerHTML=html; let o='';
  const w=n=>n.childNodes.forEach(c=>{ if(c.nodeType===3){ o+=c.nodeValue; return; } if(c.nodeType!==1) return; const t=c.tagName; if(t==='BR'){ o+='\n'; return; }
    const blk=/^(P|DIV|H3|UL|OL|LI)$/.test(t); if(blk&&o&&!o.endsWith('\n')) o+='\n'; if(t==='LI') o+='• '; w(c); if(blk&&!o.endsWith('\n')) o+='\n'; });
  w(d); return o.replace(/\n{3,}/g,'\n\n').trim();
}
function noteHtml(n){ if(typeof n.html==='string') return n.html; return n.body?n.body.split(/\n{2,}/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join(''):''; }
function normNotes(){
  L().notes.forEach(n=>{
    if(!/[\\$]/.test((n.body||'')+(n.html||''))) return;
    const d=document.createElement('div'); d.innerHTML=noteHtml(n); cleanMathDOM(d); n.html=sanitize(d.innerHTML); n.body=htmlToText(n.html);
  });
}
function nbToolbar(){

  return `<div class="nb-tool" role="toolbar" aria-label="Formatting">${B('bold','B','Bold (Ctrl+B)','font-weight:700')}${B('italic','I','Italic (Ctrl+I)','font-style:italic;font-family:Newsreader,Georgia,serif;font-size:14px')}${B('hl','Highlight','Highlight selected text')}${B('ul','• List','Bullet list')}${B('h3','Subheading','Subheading')}</div>`;
}
function nbFmt(c){
  const ed=document.getElementById('nb-body'); if(!ed) return; ed.focus();

  else if(c==='hl'){ const v=String(document.queryCommandValue('hiliteColor')||''); const on=v&&!/transparent|rgba\(0,\s*0,\s*0,\s*0\)/.test(v); document.execCommand('hiliteColor',false,on?'transparent':'#F2E2A8'); }

function nbToolState(){
  document.querySelectorAll('.nb-tool .tb').forEach(b=>{ const c=b.dataset.cmd; let on=false;
    try{ if(c==='bold') on=document.queryCommandState('bold'); else if(c==='italic') on=document.queryCommandState('italic'); else if(c==='ul') on=document.queryCommandState('insertUnorderedList'); else if(c==='h3') on=/h3/i.test(document.queryCommandValue('formatBlock')); else if(c==='hl'){ const v=String(document.queryCommandValue('hiliteColor')||''); on=!!v&&!/transparent|rgba\(0,\s*0,\s*0,\s*0\)/.test(v); } }catch(e){}

document.addEventListener('selectionchange',()=>{ const a=document.activeElement; if(a&&a.id==='nb-body') nbToolState(); });
function nbSave(){
  const n=L().notes.find(x=>x.id===lab.noteId); if(!n) return; const ed=document.getElementById('nb-body'); if(!ed) return;

function taskRow(t){
  const today=todayStr(), od=!t.done&&t.date<today, up=!t.done&&t.date>today, c=subjColor(t.subject);
  const body=editingTodoId===t.id?`<input id="edit-input-${t.id}" class="task-edit" value="${esc(t.text)}" onkeydown="if(event.key==='Enter') saveEditTodo('${t.id}')">`:`<span class="task-text" onclick="startEditTodo('${t.id}')">${esc(t.text)}</span>`;
  const subj=editingSubjId===t.id?`<input id="subj-edit" class="task-edit subj-edit" list="subj-dl" value="${esc(t.subject||'')}" onkeydown="if(event.key==='Enter')saveSubj('${t.id}');if(event.key==='Escape'){editingSubjId=null;render();}" onblur="saveSubj('${t.id}')">${subjDL('subj-dl')}`:`<button class="pill-subj" style="--c:${c}" title="Change subject" onclick="startSubjEdit('${t.id}')">${esc(t.subject||'General')}</button>`;
  return `<div class="task ${t.done?'is-done':''}"><div class="task-main"><button class="box ${t.done?'done':''}" onclick="toggleTodo('${t.id}')" aria-label="${t.done?'Mark not done':'Mark done'}"></button>${body}</div><div class="task-meta">${subj}${up?`<span class="due-mono">${fmtDateLabel(t.date)}</span>`:''}${od?`<span class="pill-od">${fmtDateLabel(t.date)}</span>`:''}<button class="flag ${t.priority==='high'?'on':''}" onclick="togglePriority('${t.id}')" aria-label="Flag as high priority">${FLAG_SVG}</button><button class="x" onclick="deleteTodo('${t.id}')" aria-label="Delete task">×</button></div></div>`;

async function moveOverdueToToday(){ const t0=todayStr(); state.todos.forEach(t=>{ if(!t.done&&t.date<t0) t.date=t0; }); await saveState(); render(); }
function renderTodo(){
