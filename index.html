<style>

:root{
  --paper:#FAF8F5; --white:#FFFDF9; --line:#E4DCCB; --ink:#242722; --ink-soft:#5B6259;
  --amber:#1B4332; --coral:#7C2D12; --priority-yellow:#C59B27; --priority-blue:#8A9A8E;
  --accent:#C59B27; --rust:#7C2D12; --sand:#E7D3B3; --sage:#E8ECE7;
  --serif:'Newsreader',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
body.dark-mode{
  --paper:#131C18; --white:#1A2722; --line:#2E3F37; --ink:#EEEADF; --ink-soft:#A9B4AC;
  --amber:#7DBFA5; --coral:#E08A6C; --priority-yellow:#E8A33A; --priority-blue:#7C8C80;
  --accent:#E8A33A; --rust:#E08A6C; --sand:#3A3426; --sage:#22332C;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--paper);font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);}
body{
  background:var(--paper);
  min-height:100vh;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--white);position:relative;}

@media (min-width:768px){
  body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 20px;
    gap:20px;
  }
  #app{
    min-height:auto;
    max-height:90vh;
    border-radius:32px;
    box-shadow:0 30px 70px rgba(74,55,40,0.22), 0 8px 24px rgba(74,55,40,0.12);
    overflow-y:auto;
    border:1px solid var(--line);
  }
  #splash{border-radius:0;}
  #desktop-sidebar{
    display:flex;
    flex-direction:column;
    width:200px;
    flex:0 0 auto;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:24px;
    padding:20px 0;
    box-shadow:0 30px 70px rgba(74,55,40,0.18), 0 8px 24px rgba(74,55,40,0.1);
    margin-top:0;
  }
  .desktop-sidebar-brand{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:2px;
    padding:0 24px 16px;
    margin-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .desktop-sidebar-divider{
    border-top:1px solid var(--line);
    margin:10px 24px;
  }
  .desktop-nav-btn{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    background:none;
    border:none;
    text-align:left;
    padding:11px 24px;
    font-size:14px;
    font-family:'Plus Jakarta Sans',sans-serif;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .desktop-nav-btn:hover{background:var(--paper);}
  .desktop-nav-btn.active{color:var(--ink);font-weight:700;background:var(--paper);}
  .desktop-nav-btn .ic{display:flex;}
  .bottom-nav{display:none;}
}
#desktop-sidebar{display:none;}
@media (max-width:767px){
  #desktop-sidebar{display:none;}
}
@media (min-width:1024px){
  #app{max-width:520px;}
}

header{
  padding:20px 20px 16px;
  border-bottom:1px solid var(--line);
}
header .greeting{font-size:20px;font-weight:700;}
header .cute-msg{font-size:13px;color:var(--ink-soft);margin-top:4px;}
header .sub{font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;color:var(--ink-soft);margin-top:6px;}

main{flex:1;padding:16px 20px 100px;overflow-y:auto;}

.card{
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px 16px;
  margin-bottom:14px;
  background:var(--white);
  box-shadow:0 1px 3px rgba(40,55,74,0.05), 0 1px 2px rgba(40,55,74,0.04);
  transition:transform 0.15s ease, box-shadow 0.15s ease;
  animation:fadeInUp 0.4s ease backwards;
}
#content .card:nth-of-type(1){animation-delay:0.02s;}
#content .card:nth-of-type(2){animation-delay:0.07s;}
#content .card:nth-of-type(3){animation-delay:0.12s;}
#content .card:nth-of-type(4){animation-delay:0.17s;}
#content .card:nth-of-type(5){animation-delay:0.22s;}
.card[onclick]:active{
  transform:scale(0.98);
  box-shadow:0 1px 2px rgba(40,55,74,0.06);
}
.tag{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:10px;letter-spacing:1px;text-transform:uppercase;
  color:var(--ink-soft);
}
.big{font-size:26px;font-weight:700;margin-top:6px;}

.pill{
  display:inline-block;font-family:'Plus Jakarta Sans',sans-serif;
  font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600;
}
.pill.coral{background:var(--coral);color:white;}
.pill.amber{background:var(--amber);color:var(--ink);}

.checkitem{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;}
.box{width:16px;height:16px;border:1.5px solid var(--ink);border-radius:5px;flex:0 0 auto;transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1), background 0.2s ease;}
.box.done{animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.box.done{background:var(--ink);}

.bottom-nav{
  position:sticky;bottom:0;
  display:flex;justify-content:space-around;
  border-top:1px solid var(--line);
  background:var(--white);
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
}
.nav-btn{
  background:none;border:none;font-family:'Plus Jakarta Sans',sans-serif;
  font-size:10px;color:var(--ink-soft);display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer;padding:4px 8px;
}
.nav-btn .ic{font-size:18px;display:flex;color:var(--ink-soft);transition:color 0.2s ease;}
.nav-btn.active{color:var(--ink);font-weight:700;}
.nav-btn.active .ic{color:var(--ink);}

.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.calgrid .dow{font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;color:var(--ink-soft);padding-bottom:4px;}
.calgrid .day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-size:13px;cursor:pointer;border:1px solid transparent;
}
.calgrid .day.exam{background:var(--coral);color:white;font-weight:700;}
.calgrid .day.today{border-color:var(--ink);font-weight:700;}
.calgrid .day.empty{cursor:default;}
.calgrid .day.has-note::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--amber);margin-top:2px;}
.priority-pill{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
.priority-pill.selected{border-color:var(--ink);}

.placeholder{
  text-align:center;padding:60px 20px;color:var(--ink-soft);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;line-height:1.8;
}

.modal-overlay{
  position:fixed;inset:0;background:rgba(36,39,34,0.45);
  display:flex;align-items:flex-end;justify-content:center;z-index:10;
}
.modal{
  background:var(--white);width:100%;max-width:480px;border-radius:20px 20px 0 0;
  padding:20px;
}
.modal input, .modal textarea{
  width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;margin-top:6px;
}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.btn{
  flex:1;padding:10px;border-radius:16px;border:none;font-weight:600;
  font-size:13px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform 0.12s ease;
}
.btn:active{transform:scale(0.96);}
.btn::after{
  content:'';
  position:absolute;top:0;left:-75%;width:50%;height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
  transform:skewX(-20deg);
  transition:left 0.5s ease;
  pointer-events:none;
}
.btn:active::after{left:125%;}
.btn.primary{background:var(--ink);color:white;}
.btn.ghost{background:var(--paper);color:var(--ink);}
.btn.danger{background:var(--coral);color:white;}

.loading{text-align:center;padding:60px;color:var(--ink-soft);font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;}

.chatbubble{border-radius:18px;padding:9px 13px;font-size:13px;max-width:82%;line-height:1.5;white-space:pre-line;}
.chatbubble.bot{background:var(--line);align-self:flex-start;}
.chatbubble.user{background:#1B4332;color:white;align-self:flex-end;}

@keyframes splashPulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.06);}
}

@keyframes popIn{
  0%{transform:scale(0.6);opacity:0;}
  60%{transform:scale(1.1);opacity:1;}
  100%{transform:scale(1);}
}

@keyframes slideIn{
  from{transform:translateX(-100%);}
  to{transform:translateX(0);}
}

@keyframes fadeInUp{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}

@keyframes flutter{
  0%{transform:translateX(-36px) translateY(0);}
  25%{transform:translateX(-8px) translateY(-8px);}
  50%{transform:translateX(36px) translateY(0);}
  75%{transform:translateX(-8px) translateY(-8px);}
  100%{transform:translateX(-36px) translateY(0);}
}

/* ===== Lumenquire: Warm Academic Editorial ===== */
html,body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
body,body.dark-mode{background:var(--paper)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.card{box-shadow:none;border-radius:12px;animation:none;transition:border-color .15s ease}
.card[onclick]:hover{border-color:var(--ink-soft)}
.card[onclick]:active{transform:none;box-shadow:none}
.tag{font-family:var(--sans);font-size:12px;letter-spacing:0;text-transform:none;font-weight:600}
.big{font-family:var(--serif);font-weight:500}
.btn{border-radius:10px}
.btn::after{display:none}
.btn.primary{background:var(--amber);color:#fff}
.btn.danger{color:#fff}
.pill.amber{color:#fff}
.box{border-color:var(--ink-soft)}
.box.done{background:var(--amber);border-color:var(--amber)}
.modal{border-radius:16px 16px 0 0;box-shadow:none;border:1px solid var(--line)}
.chatbubble{border-radius:14px}
.chatbubble.bot{background:var(--paper);border:1px solid var(--line)}
.chatbubble.user{background:var(--amber);color:#fff}
header{background:var(--white)}
header .greeting{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:-0.2px}
header .sub{font-size:12px}
.bottom-nav{background:var(--white)}
.nav-btn{font-family:var(--sans);font-size:11px}
.nav-btn.active,.nav-btn.active .ic{color:var(--amber)}
.calgrid .dow{font-family:var(--sans);font-weight:600}
#context-panel{display:none;background:var(--white);border-left:1px solid var(--line);padding:24px 22px;overflow-y:auto}
#panel-backdrop{display:none;position:fixed;inset:0;background:rgba(36,39,34,.45);z-index:29}
body.panel-open #panel-backdrop{display:block}
#context-panel.open{display:block;position:fixed;top:0;right:0;bottom:0;width:min(340px,92vw);z-index:30}
.cp-head{display:flex;justify-content:space-between;align-items:center}
.cp-head h2{font-family:var(--serif);font-weight:500;font-size:28px;margin:0}
.cp-close{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:4px;display:flex}
.cp-date{font-size:13px;color:var(--ink-soft);margin-top:2px}
.cp-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cp-label{font-size:12px;font-weight:600;color:var(--ink-soft)}
.cp-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.cp-stats .cp-num{font-size:22px;display:block;margin-top:4px}
.cp-next{font-size:14px;font-weight:600;margin-top:4px;line-height:1.3}
.cp-sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.cp-task{display:flex;align-items:flex-start;gap:10px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 0;text-align:left;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--ink)}
.cp-task .box{margin-top:2px}
.cp-task-text small{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}
.cp-task-text.is-done{text-decoration:line-through;color:var(--ink-soft)}
@media (min-width:768px){
  html,body{height:100%}
  body,body.dark-mode{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0;padding:0;height:100vh;overflow:hidden;align-items:stretch}
  #splash{border-radius:0}
  #desktop-sidebar{display:flex;flex-direction:column;width:auto;height:100vh;padding:24px 0 16px;background:var(--white);border:0;border-right:1px solid var(--line);border-radius:0;box-shadow:none;overflow-y:auto}
  .desktop-sidebar-brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:500;font-size:23px;letter-spacing:0;padding:0 24px 22px;margin:0;border:0}
  .desktop-sidebar-divider{margin:12px 24px}
  .desktop-nav-btn{flex-direction:row;align-items:center;justify-content:flex-start;text-align:left;font-family:var(--sans);font-size:14px;font-weight:500;padding:10px 24px;border-left:2px solid transparent;gap:12px}
  .desktop-nav-btn:hover{background:rgba(27,67,50,.05)}
  .desktop-nav-btn.active{color:var(--amber);font-weight:600;background:rgba(27,67,50,.07);border-left-color:var(--amber)}
  #app{max-width:none;width:100%;height:100vh;max-height:none;margin:0;border:0;border-radius:0;box-shadow:none;overflow:hidden;background:var(--paper)}
  header{background:transparent;border:0;padding:28px 32px 8px}
  header button[onclick="openSidebar()"]{display:none}
  header .greeting{text-align:left!important;font-size:34px}
  header .sub{text-align:left!important;font-size:13px}
  main{min-height:0;padding:16px 32px 48px}
  #content[data-tab="home"]{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-content:start;align-items:start}
  #content[data-tab="home"]>*{margin-bottom:0!important}
  #content:not([data-tab="home"]){max-width:1040px}
  .calgrid .day{aspect-ratio:auto;min-height:58px}
  .modal-overlay{align-items:center}
  .modal{border-radius:16px;max-width:460px}
  .bottom-nav{display:none}
  body.focus-active,body.focus-active.dark-mode{grid-template-columns:minmax(0,1fr)!important}
  body.focus-active #desktop-sidebar,body.focus-active #context-panel{display:none!important}
}
@media (min-width:1200px){
  body,body.dark-mode{grid-template-columns:240px minmax(0,1fr) 340px}
  #context-panel{display:block;height:100vh}
  #context-panel.open{position:static;width:auto}
  #panel-toggle,.cp-close,#panel-backdrop{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Warm Academic Luxury ===== */
:root{--brand-bg:#1B4332;--on-brand:#FAF8F5;--sand-soft:rgba(231,211,179,.5)}
body.dark-mode{--brand-bg:#2F6B55;--on-brand:#fff;--sand-soft:#2A2A21}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
html,body,body.dark-mode{background:var(--paper);color:var(--ink)}
::selection{background:var(--sand);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card[onclick]:hover{border-color:var(--amber)}
.tag{color:var(--ink-soft)}
header,.bottom-nav,.modal{background:var(--paper)}
.btn{border-radius:10px;font-family:var(--sans)}
.btn.primary{background:var(--brand-bg);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(.92)}
.btn.ghost{background:var(--sage);color:var(--ink)}
.btn.danger,.pill.coral{background:var(--rust);color:#fff}
.pill.amber{background:var(--sand);color:var(--ink)}
.box.done{background:var(--amber);border-color:var(--amber)}
.priority-pill.selected{border-color:var(--amber);box-shadow:0 0 0 2px var(--paper) inset}
.calgrid .day:not(.empty):hover{background:var(--sage)}
.calgrid .day.today{background:var(--sand);border-color:var(--amber);color:var(--ink)}
.calgrid .day.exam{background:var(--rust);color:#fff}
.calgrid .day.has-note::after{background:var(--accent)}
.chatbubble.bot{background:var(--sage);border:0;color:var(--ink)}
.chatbubble.user{background:var(--brand-bg);color:var(--on-brand)}
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]),textarea,select{font-family:var(--sans);color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--amber)}
.bottom-nav{border-top:1px solid var(--line)}
.nav-btn.active,.nav-btn.active .ic{color:var(--amber)}
#desktop-sidebar,#context-panel{background:var(--paper)}
.cp-stats .cp-num{color:var(--amber)}
.cp-task:hover{background:rgba(231,211,179,.3)}
@media (min-width:768px){
  .desktop-nav-btn:hover{background:rgba(231,211,179,.35)}
  .desktop-nav-btn.active{background:var(--sand);color:var(--amber);border-left:3px solid var(--accent);padding-left:21px}
  header{padding:32px 40px 8px}
  main{padding:20px 40px 56px}
  #content[data-tab="home"]{gap:20px;align-items:stretch}
  #content:not([data-tab="home"]){max-width:1120px}
  .modal{background:var(--white)}
}

/* ===== Views: Home, Timetable, Calendar, To-Do ===== */
:root{--row:52px}
.sm{padding:6px 12px!important;flex:0 0 auto!important;font-size:12px!important}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-head h2,.grp-head h3{font-family:var(--serif);font-weight:500;margin:0}
.sec-head h2{font-size:24px}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;align-items:start}
@media(min-width:768px){.home-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}#content[data-tab="home"]{display:block}}
.notice{margin-bottom:24px!important;background:var(--sand-soft);border:1px solid var(--line);border-left:3px solid var(--rust);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:20px;cursor:pointer}
.ev-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.day-grid{display:grid;grid-template-columns:70px minmax(0,1fr)}
.tt-hr{white-space:nowrap;height:var(--row);font-size:11px;color:var(--ink-soft);font-family:var(--mono);font-variant-numeric:tabular-nums;padding:4px 8px 0 0}
.day-col,.tt-body{position:relative;background-image:linear-gradient(to bottom,transparent calc(var(--row) - 1px),var(--line) calc(var(--row) - 1px));background-size:100% var(--row);border-top:1px solid var(--line)}
.tt-block{position:absolute;left:4px;right:6px;overflow:hidden;border-radius:6px;padding:4px 8px;font-size:12px;line-height:1.25;cursor:pointer;display:flex;flex-direction:column;background:color-mix(in srgb,var(--c) 16%,var(--white));border-left:3px solid var(--c);color:var(--ink);z-index:1}
.tt-block b{font-family:var(--mono);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.tt-block span{font-weight:600}.tt-block small{color:var(--ink-soft)}
.tt-now{position:absolute;left:0;right:0;height:2px;background:#C85A32;z-index:3;pointer-events:none}
.tt-now::before{content:'';position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:#C85A32}
.tt-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.tt-note{font-size:13px;color:var(--ink-soft)}
.tt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--white)}
.tt-grid{display:grid;grid-template-columns:76px repeat(6,minmax(96px,1fr));min-width:660px}
.tt-dayname{height:38px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.tt-day{border-left:1px solid var(--line)}
.tt-day.is-today .tt-dayname{color:var(--amber);background:var(--sand-soft)}
.tt-grid>div:first-child .tt-hr{padding-left:10px}
.inline-add{display:flex;gap:8px;margin-bottom:12px}
.inline-add{flex-wrap:wrap}
.inline-add input[type=text]{flex:1 1 180px;min-width:0;padding:12px 14px;font-size:14px}
.inline-add input[type=date]{flex:0 0 auto;max-width:100%;padding:8px 10px;font-size:13px}
.hint{font-size:12px;color:var(--ink-soft);margin:-2px 0 22px}
.grp{margin-bottom:28px}
.grp-head{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
.grp-head h3{font-size:21px}.grp-head span{font-size:12px;color:var(--ink-soft);font-family:var(--mono)}
.grp-sub{font-size:12px;font-weight:600;color:var(--ink-soft);margin:18px 0 2px}
.link{background:none;border:none;color:var(--amber);font:600 12px var(--sans);cursor:pointer;text-decoration:underline;margin-left:auto}
.task{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.task .box{width:18px;height:18px;border-radius:50%;padding:0;background:transparent;cursor:pointer}
.task .box.done{background:var(--amber)}
.task-text{flex:1;min-width:0;overflow-wrap:anywhere;cursor:text}
.task-edit{flex:1;padding:4px 8px;font-size:14px}
.is-done .task-text{text-decoration:line-through;color:var(--ink-soft)}
.pill-subj{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;background:color-mix(in srgb,var(--c) 14%,var(--white));color:color-mix(in srgb,var(--c) 72%,var(--ink));border:1px solid color-mix(in srgb,var(--c) 30%,var(--white))}
.pill-od{font-size:11px;font-weight:600;color:var(--rust);white-space:nowrap}
.flag{background:none;border:none;cursor:pointer;color:var(--line);display:flex;padding:2px}
.flag:hover{color:var(--ink-soft)}.flag.on{color:var(--rust)}
.x{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.empty-note{font-size:13px;color:var(--ink-soft);padding:10px 2px}
.flash-bar{display:flex;justify-content:space-between;gap:10px;width:100%;margin-top:22px;padding:14px 16px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--ink-soft);font:600 13px var(--sans);text-align:left;cursor:not-allowed}
.flash-bar span:last-child{font-weight:500;font-size:12px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-head>div:last-child{display:flex;gap:6px}
.cal-title{font-family:var(--serif);font-size:28px;font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--white);border-radius:12px;overflow:hidden}
.cal-dow{padding:8px;font-size:12px;font-weight:600;color:var(--ink-soft);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal-cell{min-height:70px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
@media(min-width:768px){.cal-cell{min-height:118px;padding:6px 8px}}
.cal-cell:hover{background:var(--sage)}.cal-cell.empty,.cal-cell.empty:hover{cursor:default;background:var(--paper)}
.cal-num{font-size:13px;font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal-cell.today .cal-num{background:var(--brand-bg);color:var(--on-brand)}
.ev{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:11px;line-height:1.35;padding:2px 6px;border-radius:4px;background:color-mix(in srgb,var(--c) 15%,var(--white));border-left:3px solid var(--c);overflow:hidden;color:var(--ink)}
.more{font-size:11px;color:var(--ink-soft)}
.cal-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--ink-soft);margin:12px 0 20px}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
@media(min-width:768px){.modal-overlay.drawer{justify-content:flex-end;align-items:stretch}.modal-overlay.drawer .modal{max-width:400px;height:100%;border-radius:0;border-width:0 0 0 1px;overflow-y:auto}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--white);border-radius:20px;padding:4px 12px;font:600 12px var(--sans);cursor:pointer;color:var(--ink)}
.chips button:hover{background:var(--sand)}
.modal-title{font-family:var(--serif);font-size:24px;font-weight:500}
.fld{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-top:12px}
.fld input,.fld select{display:block;width:100%;padding:9px 10px;margin-top:4px;font-size:14px;font-family:var(--sans)}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:8px;margin-top:14px}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;background:var(--c)}
.swatch.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--white) inset}
.form-err{color:var(--rust);font-size:12px;font-weight:600;min-height:16px;margin-top:10px}
#undo-toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--paper);padding:10px 14px 10px 18px;border-radius:12px;font-size:13px;z-index:50}
#undo-toast button{background:none;border:none;color:#F5C26B;font:700 13px var(--sans);cursor:pointer}
body.dark-mode #undo-toast button{color:var(--rust)}
@media(min-width:768px){#undo-toast{bottom:32px}}

/* ===== Study Lab, Observatory, timetable pills ===== */
.opt{font-style:normal;font-weight:400;color:var(--ink-soft);font-size:11px}
.fld-lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
.daypills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dp{font:600 12px var(--sans);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--white);color:var(--ink-soft);cursor:pointer;transition:all .25s cubic-bezier(.22,1,.36,1)}
.dp:hover{border-color:var(--amber);color:var(--amber)}
.dp.on{background:var(--amber);border-color:var(--amber);color:#fff}
.tt-block{cursor:pointer;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s cubic-bezier(.22,1,.36,1)}
.tt-block:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(27,67,50,.16)}

.lab{--lp:#FFFFFF;--lb:#FAF8F5;--ll:#E6E2D8;--lk:#242722;--ls:#6B6F66;--lg:#1B4332;--la:#C59B27;--ease:cubic-bezier(.22,1,.36,1);color:var(--lk);font-family:var(--sans)}
body.dark-mode .lab{--lp:#1A2722;--lb:#131C18;--ll:#2E3F37;--lk:#EEEADF;--ls:#A9B4AC;--lg:#7DBFA5;--la:#E8A33A}
.lab h3,.lab h4{font-family:'Newsreader',Georgia,serif;font-weight:500;margin:0}
.lab button{font-family:var(--sans)}
.lab-bar{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--ll);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.lab-tab{position:relative;background:none;border:0;padding:12px 14px;font-size:13.5px;font-weight:500;color:var(--ls);cursor:pointer;white-space:nowrap;transition:color .3s var(--ease)}
.lab-tab:hover,.lab-tab.on{color:var(--lk)}.lab-tab.on{font-weight:600}
.lab-badge{margin-left:7px;font:500 11px var(--mono);font-variant-numeric:tabular-nums;background:var(--lg);color:#fff;border-radius:99px;padding:1px 7px}
.lab-ind{position:absolute;left:0;bottom:-1px;height:2px;background:var(--lg);transition:transform .5s var(--ease),width .5s var(--ease)}
.lab-body.in{animation:labIn .45s var(--ease)}
@keyframes labIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lbtn{font-size:13px;font-weight:600;padding:9px 15px;border-radius:8px;border:1px solid var(--ll);background:var(--lp);color:var(--lk);cursor:pointer;transition:transform .25s var(--ease),border-color .25s var(--ease),background .25s var(--ease)}
.lbtn:hover{transform:translateY(-1px);border-color:var(--lg)}
.lbtn.pri{background:var(--lg);border-color:var(--lg);color:#fff}.lbtn.quiet{border-color:transparent;background:none;color:var(--ls)}
body.dark-mode .lbtn.pri{color:#10201a}
.lbtn:disabled{opacity:.5;pointer-events:none}.lbtn.wide{width:100%}
.lin{width:100%;font:400 14px/1.5 var(--sans);color:var(--lk);background:var(--lp);border:1px solid var(--ll);border-radius:8px;padding:9px 11px;transition:border-color .25s var(--ease),box-shadow .25s var(--ease);resize:vertical}
.lin:focus{outline:0;border-color:var(--lg);box-shadow:0 0 0 3px rgba(27,67,50,.1)}
.lf{display:block;margin-bottom:14px;font-size:12px;font-weight:600;color:var(--ls)}.lf>*{margin-top:6px;font-weight:400}
.seg{display:inline-flex;border:1px solid var(--ll);border-radius:8px;overflow:hidden;background:var(--lp)}
.seg button{border:0;background:none;padding:8px 16px;font:500 13px var(--mono);color:var(--ls);cursor:pointer;transition:all .25s var(--ease)}
.seg button.on{background:var(--lg);color:#fff}body.dark-mode .seg button.on{color:#10201a}
.grow{flex:1}.muted{color:var(--ls)}
.lab-err{margin-top:12px;font-size:13px;color:#9A3412;background:#FBF1EA;border:1px solid #EBCDB9;border-radius:8px;padding:10px 12px}
.lab-empty{padding:56px 24px;text-align:center;max-width:420px;margin:0 auto}.lab-empty h3{font-size:24px;margin-bottom:8px}.lab-empty p{color:var(--ls);font-size:14px;line-height:1.6;margin:0 0 18px}
.lab-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--lk);color:var(--lb);font:500 13px var(--sans);padding:10px 16px;border-radius:8px;z-index:900;transition:opacity .4s}.lab-toast.out{opacity:0}
/* notebooks */
.nb{display:grid;grid-template-columns:250px minmax(0,1fr);border:1px solid var(--ll);border-radius:12px;background:var(--lp);min-height:min(620px,calc(100vh - 200px));overflow:hidden}
.nb-side{background:var(--lb);border-right:1px solid var(--ll);padding:16px 12px;overflow-y:auto}
.nb-sidehead,.sec-h span{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ls);margin:2px 6px 10px}
.nb-sh{display:flex;align-items:center;justify-content:space-between;font:600 13px var(--sans);margin:14px 6px 4px}
.nb-plus{background:none;border:1px solid var(--ll);width:24px;height:24px;border-radius:6px;color:var(--ls);cursor:pointer;line-height:1;transition:all .25s var(--ease)}.nb-plus:hover{border-color:var(--lg);color:var(--lg)}
.nb-note{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 9px;font-size:13px;color:var(--ls);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .25s var(--ease)}
.nb-note:hover{background:rgba(27,67,50,.05);color:var(--lk)}.nb-note.on{background:var(--lp);color:var(--lk);font-weight:600;box-shadow:inset 2px 0 0 var(--lg)}
.nb-none{font-size:12.5px;color:var(--ls);margin:6px}.nb-side .lin{margin-top:16px;font-size:13px}
.nb-main{padding:20px 32px 28px;display:flex;flex-direction:column;min-width:0}
.nb-actions{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--ll);margin-bottom:22px}
.nb-title{font:500 34px/1.15 'Newsreader',Georgia,serif;border:0;background:none;color:var(--lk);width:100%;padding:0;outline:0}
.nb-meta{font-size:12px;color:var(--ls);margin:8px 0 18px}
.nb-body{flex:1;min-height:340px;border:0;outline:0;resize:none;background:none;font:400 16px/1.75 var(--sans);color:var(--lk);width:100%}
/* flashcards */
.fl{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}.sec-h h3{font-size:22px}.sec-h span{margin:0}
.crow{background:var(--lp);border:1px solid var(--ll);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;gap:8px}
.crow-top{display:flex;align-items:center}.crow .lin{font-size:13.5px;padding:7px 9px}
.chip{font:600 10.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--ll);background:var(--lb);color:var(--ls);border-radius:99px;padding:3px 10px;cursor:pointer}
.nb-plus.x{border:0;font-size:18px}
.fl-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 30px}.fl-foot .lin{width:200px}
.dpill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--ll);background:var(--lp);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;margin:0 8px 8px 0;transition:all .25s var(--ease);color:var(--lk)}
.dpill.on{border-color:var(--lg);box-shadow:inset 0 0 0 1px var(--lg)}.dpill b{font:500 11px var(--mono);color:var(--ls)}
/* review */
.rv{max-width:720px;margin:0 auto}
.rv-top{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:13px;color:var(--ls)}
.due-badge{font:500 12px var(--mono);font-variant-numeric:tabular-nums;background:var(--lg);color:#fff;border-radius:99px;padding:2px 10px}body.dark-mode .due-badge{color:#10201a}
.rv-bar{height:2px;background:var(--ll);margin-bottom:22px;border-radius:2px}.rv-bar i{display:block;height:100%;background:var(--lg);transition:width .6s var(--ease)}
.fc-wrap{perspective:1600px;cursor:pointer}
.fc{position:relative;height:clamp(300px,46vh,400px);transform-style:preserve-3d;transition:transform .8s var(--ease)}
.fc.flip{transform:rotateY(180deg)}
.fc-f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--lp);border:1px solid var(--ll);border-radius:14px;box-shadow:0 1px 0 var(--ll),0 18px 40px -22px rgba(36,39,34,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 44px;text-align:center}
.fc-back{transform:rotateY(180deg)}
.fc-kind{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ls);margin-bottom:18px}
.fc-text{font:400 clamp(22px,2.6vw,30px)/1.35 'Newsreader',Georgia,serif}
.fc-ex{margin-top:20px;font-size:14px;line-height:1.55;color:var(--ls);max-width:520px}.fc-hint{position:absolute;bottom:18px;font-size:12px;color:var(--ls)}
.blank{display:inline-block;width:92px;border-bottom:2px solid var(--lk);margin:0 4px;transform:translateY(3px)}
mark.ans{background:rgba(197,155,39,.2);color:inherit;padding:0 5px;border-radius:3px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px;opacity:0;transform:translateY(10px);pointer-events:none;transition:all .5s var(--ease)}
.rates.show{opacity:1;transform:none;pointer-events:auto}
.rate{display:flex;flex-direction:column;gap:4px;align-items:center;padding:12px 8px;border:1px solid var(--ll);background:var(--lp);border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--lk);transition:all .25s var(--ease)}
.rate:hover{transform:translateY(-2px);border-color:var(--lg)}.rate code{font:500 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--ls)}
.rate.r0:hover{border-color:#C2410C}.rate.r3:hover{border-color:var(--la)}
/* feynman */
.fy{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--ll);border-radius:12px;background:var(--lp);overflow:hidden}
.fy>div{padding:22px 26px}.fy>div+div{border-left:1px solid var(--ll);background:var(--lb)}
.fy h4{font-size:19px;margin:20px 0 8px}.fy p{font-size:14px;line-height:1.65;margin:0}
.fy-num{font:500 56px/1 var(--mono);font-variant-numeric:tabular-nums}.fy-num small{font-size:18px;color:var(--ls)}
.fy-bar{height:3px;background:var(--ll);border-radius:3px;margin:12px 0 4px}.fy-bar i{display:block;height:100%;background:var(--lg);border-radius:3px;transition:width .9s var(--ease)}
.fy-flag{border-left:2px solid var(--la);padding:2px 0 2px 12px;margin-bottom:10px;font-size:13.5px;line-height:1.55}.fy-flag q{font:italic 500 15px 'Newsreader',serif;display:block}.fy-flag span{color:var(--ls)}
.fy-flag.gap{border-color:var(--lg)}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--ll),var(--lb),var(--ll));background-size:200% 100%;animation:sk 1.4s linear infinite;margin-bottom:10px}@keyframes sk{to{background-position:-200% 0}}
/* blurting */
.bl{max-width:760px;margin:0 auto}
.bl-time{font:500 56px/1 var(--mono);font-variant-numeric:tabular-nums;text-align:center;margin:6px 0 16px}
.bl-canvas{min-height:min(420px,50vh);font:400 17px/1.75 var(--sans);padding:22px 26px}
.bl-cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bl-cmp>div{border:1px solid var(--ll);border-radius:12px;background:var(--lp);padding:18px 20px;font-size:14px;line-height:1.7;white-space:pre-wrap;max-height:420px;overflow:auto}
.bl-cmp h4{font-size:17px;margin-bottom:8px}.bl-cmp mark.miss{background:rgba(184,116,26,.22);color:inherit;border-radius:3px;padding:0 2px}.bl-cmp mark.hit{background:rgba(27,67,50,.14);color:inherit;border-radius:3px;padding:0 2px}
.bl-stat{display:flex;gap:28px;align-items:baseline;margin-bottom:16px}.bl-stat b{font:500 40px var(--mono);font-variant-numeric:tabular-nums}.bl-stat span{font-size:13px;color:var(--ls)}
.bl-act{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
/* observatory */
#content[data-tab="tracker"]{overflow:hidden}
#obs-slot{height:calc(100vh - 150px);min-height:420px}
.obs-stage{position:fixed;z-index:60;display:none;overflow:hidden;border-radius:14px;background:#080D1A;border:1px solid #1d2744;font-family:var(--sans);color:#F8F6F1}
.obs-stage.anim{transition:left .8s cubic-bezier(.22,1,.36,1),top .8s cubic-bezier(.22,1,.36,1),width .8s cubic-bezier(.22,1,.36,1),height .8s cubic-bezier(.22,1,.36,1),border-radius .8s cubic-bezier(.22,1,.36,1)}
.obs-stage.full{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0;border:0;z-index:400}
.obs-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#desktop-sidebar,#context-panel{transition:transform .8s cubic-bezier(.22,1,.36,1),opacity .6s}
body.obs-full #desktop-sidebar{transform:translateX(-100%);opacity:0}body.obs-full #context-panel{transform:translateX(100%);opacity:0}
.obs-pill{position:absolute;top:16px;background:rgba(8,13,26,.55);border:1px solid rgba(212,175,55,.45);color:#E9DDB0;font:500 12.5px var(--sans);padding:8px 14px;border-radius:99px;cursor:pointer;transition:all .35s cubic-bezier(.22,1,.36,1)}
.obs-pill:hover{border-color:#D4AF37;color:#F8F6F1;transform:translateY(-1px)}
.obs-back{left:16px;opacity:0;pointer-events:none}.obs-exp{right:16px}
.obs-stage.full .obs-back{opacity:1;pointer-events:auto}.obs-stage.full .obs-exp{display:none}
.obs-stats{position:absolute;top:22px;left:0;right:0;text-align:center;font:400 italic 14px 'Newsreader',serif;color:rgba(233,221,176,.6);pointer-events:none}
.obs-ui{position:absolute;left:0;right:0;bottom:4%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 16px;text-align:center}
.obs-eyebrow,.obs-sub{font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#D4AF37}
.obs-time{font:400 clamp(56px,7vw,96px)/1 'Newsreader',Georgia,serif;font-feature-settings:'tnum';letter-spacing:.02em}

<script>
const LQ_KEY = 'lumenquire-planner-state';
let state = { todos: [], examDates: {}, notes: {}, hoursLog: {}, chatLog: [], tutorialSeen: false, subjectDayHours: {}, studyAdvice: null, calendarEntries: {}, notifyDaysBefore: 3, darkMode: false };
let currentTab = 'home';
let stateLoaded = false;

async function loadState(){
  try{
    if(window.storage){
      const result = await window.storage.get('planner-state', false);
      if(result && result.value){
        state = JSON.parse(result.value);
        stateLoaded = true;
        return;
      }
    }
  }catch(e){
    // window.storage not available here — fall through to localStorage
  }
  try{
    let raw = localStorage.getItem(LQ_KEY);
    if(!raw){
      // One-time migration: copy any saved Lumenquire data into Lumenquire's key (the old copy is kept as a backup).
      const legacy = localStorage.getItem('glade-planner-state');
      if(legacy){ raw = legacy; try{ localStorage.setItem(LQ_KEY, legacy); }catch(e){} }
    }
    if(raw){
      state = JSON.parse(raw);
    }
  }catch(e){
    console.log('No saved state yet, starting fresh.');
  }
  stateLoaded = true;
  if(state.chatLog && state.chatLog.length){
    const t = todayStr();
    state.chatLog.forEach(m => { if(!m.date) m.date = t; });
  }
}

async function saveState(){
  try{
    if(window.storage){
      await window.storage.set('planner-state', JSON.stringify(state), false);
    }
  }catch(e){
    // window.storage not available here — fall through to localStorage
  }
  try{
    localStorage.setItem(LQ_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Save failed', e);
  }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function fmtDateLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function daysUntil(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const t = new Date(todayStr()+'T00:00:00');
  return Math.round((d - t) / 86400000);
}

function priorityColor(p){
  if(p==='red') return 'var(--coral)';
  if(p==='yellow') return 'var(--priority-yellow)';
  return 'var(--amber)';
}

function getAllUpcomingEntries(){
  const today = todayStr();
  const results = [];
  const entries = state.calendarEntries || {};
  Object.keys(entries).filter(d=>d>=today).sort().forEach(d=>{
    (entries[d]||[]).forEach(e=>{ results.push({ date: d, ...e }); });
  });
  const priorityOrder = {red:0, yellow:1, blue:2};
  results.sort((a,b)=>{
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (priorityOrder[a.priority] ?? 3) - (priorityOrder[b.priority] ?? 3);
  });
  return results;
}

function nextExam(){
  const upcoming = getAllUpcomingEntries();
  return upcoming.length ? upcoming[0].date : null;
}

function nextEntryLabel(){
  const upcoming = getAllUpcomingEntries();
  if(!upcoming.length) return '';
  const e = upcoming[0];
  return `${e.type}${e.label ? ': '+e.label : ''}`;
}

function hoursToday(){
  return state.hoursLog[todayStr()] || 0;
}

let greetingText = '';
const motivationalQuotes = [
  "Small steps today, big wins on results day.",
  "You don't have to feel ready. Just start.",
  "Progress hides in ordinary days.",
  "Future you is counting on today's you.",
  "One page, one problem, one step at a time.",
  "Consistency beats intensity.",
  "Nobody sees the hours. They see the results.",
  "You're closer than you were yesterday.",
  "Effort compounds. Keep going.",
  "The work you avoid is usually the work that matters most.",
  "Done is better than perfect — start anyway.",
  "Hard now, easier later.",
  "Success is built in the sessions no one applauds.",
  "You don't need motivation. You need momentum.",
  "Every expert was once exactly where you are now.",
  "Discipline is choosing what you want most over what you want now.",
  "The exam doesn't test luck. It tests preparation.",
  "Small, boring, repeated actions win in the end.",
  "Confidence is built one solved problem at a time."
];
let cuteMsgText = motivationalQuotes[0];
function pickCuteMsg(){
  let next = motivationalQuotes[Math.floor(Math.random()*motivationalQuotes.length)];
  if(motivationalQuotes.length > 1){
    while(next === cuteMsgText){
      next = motivationalQuotes[Math.floor(Math.random()*motivationalQuotes.length)];
    }
  }
  cuteMsgText = next;
}

function pickGreeting(){
  const name = state.username || 'there';
  const hour = new Date().getHours();
  if(hour < 12){
    greetingText = `Good morning, ${name}!`;
    return;
  }
  const options = [
    `Hey ${name}, ready to study?`,
    `How's it going, ${name}?`,
    `Good luck with today's session, ${name}`,
    `What's up, ${name}?`
  ];
  greetingText = options[Math.floor(Math.random()*options.length)];
}

function renderHeader(){
  const n = nextExam();

async function callGeminiOnce(model, systemText, userText, imagePart){
  const response = await fetch(AI_WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model,
      systemText,
      userText: userText || "Here's an image.",
      imageBase64: imagePart ? imagePart.base64 : null,
      imageMime: imagePart ? imagePart.mimeType : null
    })
  });
  const data = await response.json();
  const raw = data?.choices?.[0]?.message?.content;
  if(!raw) throw new Error(data?.error?.message || 'No response from AI');
  const afterThinkStrip = raw.replace(/<think>[\s\S]*?<\/think>/gi, '');
  if(/<think>/i.test(afterThinkStrip)){
    // An opening <think> tag survived stripping — it was never closed, meaning the
    // response got cut off mid-reasoning. Never show this raw internal text to the user.
    throw new Error("The AI's response got cut off while working through that — please try again.");
  }
  const stripped = afterThinkStrip.replace(/```json|```/g, '').trim();
  // Models sometimes add a friendly sentence before/after the JSON despite instructions —
  // pull out just the { ... } or [ ... ] block instead of assuming the whole string is JSON.
  const objStart = stripped.indexOf('{');
  const objEnd = stripped.lastIndexOf('}');
  const arrStart = stripped.indexOf('[');
  const arrEnd = stripped.lastIndexOf(']');
  let clean = stripped;
  if(objStart !== -1 && objEnd !== -1 && objEnd > objStart){
    clean = stripped.slice(objStart, objEnd+1);
  } else if(arrStart !== -1 && arrEnd !== -1 && arrEnd > arrStart){
    clean = stripped.slice(arrStart, arrEnd+1);
  }
  try{
    return JSON.parse(clean);
  }catch(parseErr){
    // Model gave a real answer but not in strict JSON — use it as-is rather than losing it.
    return { reply: stripped || "I'm here — could you say that again?", reschedule: false };
  }
}

function isRateLimitError(message){
  return !!message && /rate limit/i.test(message);
}

function isOfflineError(message){
  return !!message && /failed to fetch|networkerror|load failed|internet connection appears to be offline/i.test(message);
}

// Groq's rate-limit errors include the actual wait time, e.g. "Please try again in 6.14s".
// If we can read that, it's almost always faster to wait it out and retry the SAME model
// than to jump straight to a different (possibly weaker) one.
function parseRetryDelayMs(message){
  if(!message) return null;
  const m = /try again in ([\d.]+)\s*s/i.exec(message);
  if(!m) return null;
  const secs = parseFloat(m[1]);
  if(isNaN(secs)) return null;
  return Math.min(Math.ceil(secs * 1000) + 300, 9000); // small buffer, capped so the UI never hangs too long
}

async function callGemini(systemText, userText, imagePart){
  const chain = imagePart ? VISION_MODEL_CHAIN : TEXT_MODEL_CHAIN;
  let lastError = null;
  for(const model of chain){
    try{
      return await callGeminiOnce(model, systemText, userText, imagePart);
    }catch(e){
      lastError = e;
      const msg = (e && e.message) ? e.message : String(e);
      if(isRateLimitError(msg)){
        const waitMs = parseRetryDelayMs(msg);
        if(waitMs){
          await new Promise(r => setTimeout(r, waitMs));
          try{
            return await callGeminiOnce(model, systemText, userText, imagePart);
          }catch(e2){
            lastError = e2;
          }
        }
      }
      // Either not a rate limit, or the retry also failed — move to the next model in the chain.
    }
  }
  throw lastError || new Error('All AI models unavailable');
}

function extractPlanArray(result){

  if(!result || typeof result !== 'object') return null;
  const keys = ['plan','sessions','schedule','timetable','items','tasks'];
  for(const k of keys){

}

  const result = await callGemini(systemText, "Generate my timetable.", null);

  let plan = extractPlanArray(result);
  if(!plan && result && result.reply){
    try{
      const text = result.reply;
      const objStart = text.indexOf('{'), objEnd = text.lastIndexOf('}');
      const arrStart = text.indexOf('['), arrEnd = text.lastIndexOf(']');
      let reparsed = null;
      if(objStart !== -1 && objEnd > objStart){
        reparsed = JSON.parse(text.slice(objStart, objEnd+1));
      } else if(arrStart !== -1 && arrEnd > arrStart){
        reparsed = JSON.parse(text.slice(arrStart, arrEnd+1));
      }
      plan = extractPlanArray(reparsed);
    }catch(e){ /* fall through */ }

}

  `).join('');
}

function cleanMathNotation(text){
  if(!text) return text;
  return text
    .replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, '($1/$2)')
    .replace(/\\times/g, 'x')
    .replace(/\\cdot/g, '.')
    .replace(/\\div/g, '/')
    .replace(/\\text\{([^}]*)\}/g, '$1')
    .replace(/\$\$?/g, '')
    .replace(/([A-Za-z])_(\d+)/g, '$1$2')
    .replace(/\\[a-zA-Z]+/g, '')
    .replace(/[{}]/g, '');
}

const TT_START=8, TT_END=20, TT_ROW=52;
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TT_COLORS=['#2F6B55','#C85A32','#C59B27','#4F6D7A','#7A5C7E','#7A8450'];
const PAGE_TITLES={timetable:'Weekly Timetable',calendar:'Academic Calendar',todo:'To-Do',tracker:'Observatory',chat:'Study Lab',settings:'Settings'};
const FLAG_SVG='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3v18h2v-7h11l-2-4 2-4H7V3z"/></svg>';
let calOffset=0, clColor=TT_COLORS[0], undoTimer=null;
function tt(){ if(!state.timetable) state.timetable=[]; return state.timetable; }
function pad2(n){ return String(n).padStart(2,'0'); }
function toMin(t){ const a=String(t||'0:0').split(':'); return (+a[0])*60+(+a[1]||0); }
function fmtTime(t){ const a=String(t).split(':'); let h=+a[0]; const m=+a[1]||0; const ap=h>=12?'PM':'AM'; h=h%12||12; return h+(m?':'+pad2(m):':00')+' '+ap; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function subjColor(n){ let h=0; for(const c of String(n||'General')) h=(h*31+c.charCodeAt(0))>>>0; return TT_COLORS[h%TT_COLORS.length]; }
function cmpTask(a,b){ if(a.date!==b.date) return a.date<b.date?-1:1; return (b.priority==='high')-(a.priority==='high'); }

function undoToast(msg, undo){
  const old=document.getElementById('undo-toast'); if(old) old.remove(); clearTimeout(undoTimer);
  const el=document.createElement('div'); el.id='undo-toast'; el.setAttribute('role','status');
  el.innerHTML='<span>'+escapeHtml(msg)+'</span><button>Undo</button>';
  el.querySelector('button').onclick=async()=>{ el.remove(); clearTimeout(undoTimer); await undo(); };
  document.body.appendChild(el); undoTimer=setTimeout(()=>el.remove(),7000);
}

function nowLine(){ const m=nowMin(); if(m<TT_START*60||m>TT_END*60) return ''; return '<div class="tt-now" style="top:'+((m-TT_START*60)/60*TT_ROW)+'px"></div>'; }
function classBlock(c){
  const top=(toMin(c.start)-TT_START*60)/60*TT_ROW, h=Math.max(24,(toMin(c.end)-toMin(c.start))/60*TT_ROW-2);
  return `<div class="tt-block" style="top:${top}px;height:${h}px;--c:${escapeHtml(c.color||TT_COLORS[0])}" onclick="event.stopPropagation();openClassModal('${c.id}')"><b>${escapeHtml(c.code||'')}</b><span>${escapeHtml(c.subject||'')}</span><small>${escapeHtml(c.room||'')}</small></div>`;
}
function hourLabels(){ let o=''; for(let h=TT_START;h<TT_END;h++) o+=`<div class="tt-hr">${fmtTime(h+':00')}</div>`; return o; }

function taskRow(t){

    ? `<input id="edit-input-${t.id}" class="task-edit" value="${escapeHtml(t.text)}" onkeydown="if(event.key==='Enter') saveEditTodo('${t.id}')">`

  return `<div class="task ${t.done?'is-done':''}"><button class="box ${t.done?'done':''}" onclick="toggleTodo('${t.id}')" aria-label="${t.done?'Mark not done':'Mark done'}"></button>${body}<span class="pill-subj" style="--c:${c}">${escapeHtml(t.subject||'General')}</span>${od?`<span class="pill-od">${fmtDateLabel(t.date)}</span>`:''}<button class="flag ${t.priority==='high'?'on':''}" onclick="togglePriority('${t.id}')" aria-label="Flag as high priority">${FLAG_SVG}</button><button class="x" onclick="deleteTodo('${t.id}')" aria-label="Delete task">×</button></div>`;

async function quickAdd(inputId, dateId){
  const inp=document.getElementById(inputId); if(!inp) return; let raw=inp.value.trim(); if(!raw) return;
  let priority=null; if(/^!\s*|\s*!$/.test(raw)){ priority='high'; raw=raw.replace(/^!\s*|\s*!$/,'').trim(); }
  let subject=(inputId==='todo-add'&&document.getElementById('todo-add-subj')&&document.getElementById('todo-add-subj').value)||'General', text=raw; const m=raw.match(/^([^:]{1,24}):\s*(.+)$/); if(m){ subject=m[1].trim(); text=m[2].trim(); }
  if(!text) return;
  const dEl=dateId?document.getElementById(dateId):null;
  const todo={id:'todo_'+Date.now()+'_'+Math.floor(Math.random()*1000),text,subject,date:(dEl&&dEl.value)||todayStr(),done:false};
  if(priority) todo.priority=priority;
  state.todos.push(todo); await saveState(); render();
  const again=document.getElementById(inputId); if(again) again.focus();
}
async function togglePriority(id){ const t=state.todos.find(x=>x.id===id); if(!t) return; if(t.priority==='high') delete t.priority; else t.priority='high'; await saveState(); render(); }
async function moveUnfinishedToTomorrow(){
  const ids=state.todos.filter(t=>t.date<=todayStr()&&!t.done).map(t=>({id:t.id,date:t.date}));
  if(!ids.length) return; moveTodosToTomorrow(); await saveState(); render();
  undoToast('Moved '+ids.length+' task'+(ids.length===1?'':'s')+' to tomorrow', async()=>{ ids.forEach(o=>{ const t=state.todos.find(x=>x.id===o.id); if(t) t.date=o.date; }); await saveState(); render(); });
}

function slotClick(e,day){ const r=e.currentTarget.getBoundingClientRect(); const h=TT_START+Math.floor((e.clientY-r.top)/TT_ROW); openClassModal(null,day,pad2(Math.min(h,TT_END-1))+':00'); }

function evColor(e){
  const t=String(e.type||'');
  if(/exam|test|quiz|viva/i.test(t)) return '#C85A32';
  if(/assign|homework|project|deadline|submi/i.test(t)) return '#1B4332';

}
function calShift(n){ calOffset+=n; render(); }
function calToday(){ calOffset=0; render(); }
function renderCalendar(){
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+calOffset);
  const year=base.getFullYear(), month=base.getMonth(), startDow=new Date(year,month,1).getDay(), dim=new Date(year,month+1,0).getDate();
  let cells=''; for(let i=0;i<startDow;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=dim;d++){

    const pills=es.slice(0,3).map(e=>`<div class="ev" style="--c:${evColor(e)}">${escapeHtml(e.type+(e.label?': '+e.label:''))}</div>`).join('')+(es.length>3?`<div class="more">+${es.length-3} more</div>`:'');

async function deleteTodo(id){

let examReminderBanner = null;

let lastNotifiedKey = null;

function checkExamReminders(){
  const upcoming = getAllUpcomingEntries();
  if(!upcoming.length){ examReminderBanner = null; return; }
  const next = upcoming[0];
  const days = daysUntil(next.date);
  const threshold = state.notifyDaysBefore ?? 3;
  if(days >= 0 && days <= threshold){
    examReminderBanner = `${next.type}${next.label?': '+next.label:''} is in ${days} day${days===1?'':'s'}!`;
    const notifyKey = next.date+'|'+next.type+'|'+(next.label||'');
    try{
      if('Notification' in window){
        if(Notification.permission === 'granted'){
          if(notifyKey !== lastNotifiedKey){
            new Notification('Lumenquire reminder', { body: examReminderBanner });
            lastNotifiedKey = notifyKey;
          }
        } else if(Notification.permission !== 'denied'){
          Notification.requestPermission().then(perm=>{
            if(perm === 'granted' && notifyKey !== lastNotifiedKey){
              new Notification('Lumenquire reminder', { body: examReminderBanner });
              lastNotifiedKey = notifyKey;
            }
          }).catch(()=>{});
        }
      }
    }catch(e){ /* native notifications unavailable — in-app banner still shows */ }
  } else {
    examReminderBanner = null;
  }
}

let tutorialIndex = 0;
let tutorialOpenIsFirstTime = null;

function openTutorial(isFirstTime){
  tutorialOpenIsFirstTime = isFirstTime;
  document.querySelector('.bottom-nav').style.display = 'none';
  renderTutorialSlide(isFirstTime);
}

function renderTutorialSlide(isFirstTime){
  const s = tutorialSlides[tutorialIndex];
  const dots = tutorialSlides.map((_,i)=>`<span style="width:6px;height:6px;border-radius:50%;background:${i===tutorialIndex?'var(--ink)':'var(--line)'};display:inline-block;margin:0 3px;transition:background 0.2s ease;"></span>`).join('');
  const content = document.getElementById('content');
  content.innerHTML = `
    <div id="tutorial-slide" style="min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:0 8px;">
      <div style="color:var(--ink);">${s.icon}</div>
      <div style="font-size:19px;font-weight:700;">${s.title}</div>
      <div style="font-size:13px;color:var(--ink-soft);line-height:1.6;max-width:320px;">${s.text}</div>
      <div style="margin-top:6px;">${dots}</div>
    </div>
    <div style="display:flex;gap:10px;padding:0 4px;">
      ${tutorialIndex > 0 ? '<button class="btn ghost" onclick="prevTutorialSlide('+isFirstTime+')">Back</button>' : `<button class="btn ghost" onclick="finishTutorial(${isFirstTime})">Skip</button>`}
      ${tutorialIndex < tutorialSlides.length-1
        ? `<button class="btn primary" onclick="nextTutorialSlide(${isFirstTime})">Next</button>`
        : `<button class="btn primary" onclick="finishTutorial(${isFirstTime})">Get started</button>`}
    </div>
  `;
  const slideEl = document.getElementById('tutorial-slide');
  if(slideEl){
    slideEl.style.animation = 'none';
    void slideEl.offsetHeight;
    slideEl.style.animation = 'fadeInUp 0.3s ease';
  }
}

function nextTutorialSlide(isFirstTime){
  tutorialIndex = Math.min(tutorialIndex+1, tutorialSlides.length-1);
  renderTutorialSlide(isFirstTime);
}

function prevTutorialSlide(isFirstTime){
  tutorialIndex = Math.max(tutorialIndex-1, 0);
  renderTutorialSlide(isFirstTime);
}

async function finishTutorial(isFirstTime){
  tutorialIndex = 0;

}

// ---------- Back button handling (phone hardware/gesture back) ----------
// Instead of letting the OS close Lumenquire the moment back is pressed, we keep
// a "guard" entry on the history stack. Each back press first closes
// whatever's open/navigates up a level; only pressing back again at the
// true Home screen, with nothing open, actually exits the app.
let backExitArmed = false;
let backExitTimer = null;

function pushBackGuard(){
  try{ history.pushState({ gladeGuard:true }, ''); }catch(e){}
}

function showExitToast(){
  let t = document.getElementById('exit-toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'exit-toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--white);font-family:\'Plus Jakarta Sans\',sans-serif;font-size:12.5px;padding:9px 18px;border-radius:20px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,0.25);opacity:0;transition:opacity 0.2s ease;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = 'Tap back again to exit';
  t.style.opacity = '1';
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>{ t.style.opacity = '0'; }, 1800);
}

function handleBackPress(){
  const confirmModalSlot = document.getElementById('confirm-modal-slot');
  if(confirmModalSlot && confirmModalSlot.innerHTML.trim() !== ''){
    closeResetConfirm();
    return true;
  }
  const dayModalSlot = document.getElementById('day-modal-slot');
  if(dayModalSlot && dayModalSlot.innerHTML.trim() !== ''){
    closeDayModal();
    return true;
  }
  const sidebarSlot = document.getElementById('sidebar-slot');
  if(sidebarSlot && sidebarSlot.innerHTML.trim() !== ''){
    closeSidebar();
    return true;
  }
  const chatHistorySlot = document.getElementById('chat-history-slot');
  if(chatHistorySlot && chatHistorySlot.innerHTML.trim() !== ''){
    if(chatHistoryView === 'day'){
      openChatHistoryList();
    } else {
      closeChatHistory();
    }
    return true;
  }
  if(tutorialOpenIsFirstTime !== null){
    if(tutorialIndex > 0){
      prevTutorialSlide(tutorialOpenIsFirstTime);
    }
    return true;
  }
  if(obs.full){
    obsExit();
    return true;
  }
  if(showTimetableForm){
    showTimetableForm = false;
    render();
    return true;
  }
  if(currentTab !== 'home'){
    goToTab('home');
    return true;
  }
  if(!backExitArmed){
    backExitArmed = true;
    showExitToast();
    clearTimeout(backExitTimer);
    backExitTimer = setTimeout(()=>{ backExitArmed = false; }, 1800);
    return true;
  }
  return false;
}

window.addEventListener('popstate', function(){
  if(handleBackPress()){
    pushBackGuard();
  }
});
pushBackGuard();

async function init(){
  const [_] = await Promise.all([loadState(), new Promise(r=>setTimeout(r,4500))]);
  applyTheme();
  if(!state.username){
    showOnboarding();
    hideSplash();
    return;
  }
  pickGreeting();
  pickCuteMsg();
  checkExamReminders();
  setInterval(()=>{ if((currentTab==='home'||currentTab==='timetable')&&!document.querySelector('.modal-overlay')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render(); },60000);
  setInterval(()=>{ checkExamReminders(); if(currentTab === 'home') render(); }, 5*60*1000);
  render();
  hideSplash();
}

function uid(p){ return p+'_'+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36); }

async function saveClass(id){
  const g=x=>document.getElementById(x).value.trim();
  const o={start:g('cl-start'),end:g('cl-end'),code:g('cl-code'),subject:g('cl-subject'),room:g('cl-room'),color:clColor};
  const err=m=>{ document.getElementById('cl-err').textContent=m; };
  const days=[...clDays].sort((a,b)=>a-b);
  if(!o.subject&&!o.code) return err('Add a subject or course code.');
  if(!days.length) return err('Pick at least one day.');
  if(!o.start||!o.end||toMin(o.end)<=toMin(o.start)) return err('End time must be after the start time.');
  if(toMin(o.start)<TT_START*60||toMin(o.end)>TT_END*60) return err('Classes run between 8:00 AM and 8:00 PM.');
  const mk=d=>Object.assign({id:'class_'+Date.now()+'_'+Math.floor(Math.random()*100000),day:d},o);
  if(id){ const c=tt().find(x=>x.id===id); const first=days.includes(c.day)?c.day:days[0]; Object.assign(c,o,{day:first}); days.filter(d=>d!==first).forEach(d=>tt().push(mk(d))); }

async function nbDel(){ const l=L(), i=l.notes.findIndex(x=>x.id===lab.noteId); if(i<0) return; const n=l.notes.splice(i,1)[0]; await saveState(); labPaint(true); undoToast('Note deleted',async()=>{ l.notes.splice(Math.min(i,l.notes.length),0,n); lab.noteId=n.id; await saveState(); if(currentTab==='chat') labPaint(true); }); }

/* ---------- tab 1: active recall ---------- */
const FL_SYS=`You write study flashcards for a student. Return ONLY valid JSON, no prose, no markdown: {"cards":[{"type":"qa","q":"...","a":"...","ex":"..."},{"type":"cloze","q":"sentence with the hidden term wrapped like {{term}}","a":"term","ex":"..."}]}. Mix about 60% conceptual "qa" cards that test WHY or HOW something works (never trivial trivia or definitions-only) with about 40% "cloze" fill-in-the-blank cards using {{double braces}} around one key term. Keep every answer under 30 words and every "ex" explanation under 20 words. Use plain text only: no LaTeX, no dollar signs, no backslashes.`;
function labFlash(){
  const l=L(), decks=allSubjects(); if(!lab.viewDeck||!decks.includes(lab.viewDeck)) lab.viewDeck=decks[0]||'';
  const opts='<option value="">Paste text or a topic instead</option>'+l.notes.map(n=>`<option value="${n.id}"${n.id===lab.src?' selected':''}>${esc(n.subject)} · ${esc(n.title||'Untitled')}</option>`).join('');
  const sn=l.notes.find(n=>n.id===lab.src), deckDefault=(sn&&sn.subject)||lab.viewDeck||'';
  const prev=lab.busy?'<div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:45%"></div>'
    :lab.gen.length?lab.gen.map((c,i)=>cardRow('gen',i)).join(''):'<p class="muted" style="font-size:14px;line-height:1.6">Generated cards appear here for you to edit before saving. You can also write your own.</p>';
  const dc=l.cards.map((c,i)=>[c,i]).filter(([c])=>c.deck===lab.viewDeck);
  return `<div class="fl"><div><div class="sec-h"><h3>Generate</h3></div>
    <label class="lf">Source note<select class="lin" onchange="lab.src=this.value;labPaint(true)">${opts}</select></label>
    ${lab.src?'':`<label class="lf">Text or topic<textarea class="lin" rows="7" oninput="lab.text=this.value" placeholder="Paste your notes, or type a topic like photosynthesis">${esc(lab.text)}</textarea></label>`}
    <div class="lf">Cards<div><div class="seg">${[5,10,15].map(n=>`<button class="${lab.count===n?'on':''}" onclick="lab.count=${n};labPaint(true)">${n}</button>`).join('')}</div></div></div>
    <button class="lbtn pri wide" onclick="labGenerate()" ${lab.busy?'disabled':''}>${lab.busy?'Writing cards…':'Generate cards'}</button>${lab.err?`<div class="lab-err">${esc(lab.err)}</div>`:''}</div>
  <div><div class="sec-h"><h3>Preview</h3><span>${lab.gen.length?lab.gen.length+' cards':''}</span></div>${prev}
    <div class="fl-foot"><input id="fl-deck" class="lin" list="fl-decks" placeholder="Subject deck" value="${esc(deckDefault)}"><datalist id="fl-decks">${decks.map(d=>`<option value="${esc(d)}">`).join('')}</datalist><button class="lbtn pri" onclick="labSaveGen()">Save to Subject Deck</button><button class="lbtn" onclick="lab.gen.push({type:'qa',q:'',a:'',ex:''});labPaint(true)">+ Add card</button></div>
    <div class="sec-h"><h3>Saved decks</h3></div>${decks.length?decks.map(d=>`<button class="dpill${d===lab.viewDeck?' on':''}" onclick="lab.viewDeck=this.dataset.d;labPaint(true)" data-d="${esc(d)}">${esc(d)}<b>${l.cards.filter(c=>c.deck===d).length}</b></button>`).join(''):'<p class="muted" style="font-size:14px">No decks yet.</p>'}
    ${lab.viewDeck?`<div style="margin-top:8px">${dc.map(([c,i])=>cardRow('deck',i)).join('')}<button class="lbtn" onclick="deckAdd()">+ Add card to ${esc(lab.viewDeck)}</button></div>`:''}</div></div>`;
}
function cardRow(k,i){
  const c=k==='gen'?lab.gen[i]:L().cards[i], ref=k==='gen'?`lab.gen[${i}]`:`L().cards[${i}]`;
  return `<div class="crow"><div class="crow-top"><button class="chip" onclick="cardType('${k}',${i})" title="Switch card type">${c.type==='cloze'?'Cloze':'Q&amp;A'}</button><span class="grow"></span><button class="nb-plus x" onclick="cardDel('${k}',${i})" aria-label="Remove card">×</button></div>
  <textarea class="lin" rows="2" oninput="${ref}.q=this.value;labDirty()" placeholder="${c.type==='cloze'?'Sentence with the hidden term in {{double braces}}':'Question'}">${esc(c.q)}</textarea>
  ${c.type==='cloze'?'':`<textarea class="lin" rows="2" oninput="${ref}.a=this.value;labDirty()" placeholder="Answer">${esc(c.a)}</textarea>`}
  <input class="lin" value="${esc(c.ex||'')}" oninput="${ref}.ex=this.value;labDirty()" placeholder="Explanation (optional)"></div>`;
}
function cardList(k){ return k==='gen'?lab.gen:L().cards; }
function cardType(k,i){ const c=cardList(k)[i]; c.type=c.type==='cloze'?'qa':'cloze'; labDirty(); labPaint(true); }
function cardDel(k,i){ cardList(k).splice(i,1); labDirty(); labPaint(true); }
function newCard(deck,o){ return Object.assign({id:uid('c'),deck,type:'qa',q:'',a:'',ex:'',ease:2.5,interval:0,reps:0,due:Date.now(),created:Date.now()},o); }
function deckAdd(){ L().cards.push(newCard(lab.viewDeck,{})); labDirty(); labPaint(true); }
async function labGenerate(){
  const note=L().notes.find(n=>n.id===lab.src), raw=(note?note.body:lab.text).trim();
  if(!raw){ lab.err='Pick a note or paste some text first.'; return labPaint(true); }
  lab.busy=true; lab.err=''; labPaint(true);
  try{
    const r=await callGemini(FL_SYS,`Create exactly ${lab.count} cards from this material:\n\n${raw.slice(0,6000)}`);
    const arr=Array.isArray(r)?r:r&&r.cards; if(!arr||!arr.length) throw new Error('The reply was not usable. Please try again.');
    lab.gen=arr.slice(0,lab.count).map(c=>{ const q=String(c.q||'').trim(), cz=/cloze/i.test(c.type)||/\{\{.+?\}\}/.test(q); return {type:cz?'cloze':'qa',q,a:String(c.a||'').trim(),ex:String(c.ex||'').trim()}; }).filter(c=>c.q);
    if(!lab.gen.length) throw new Error('The reply was not usable. Please try again.');
  }catch(e){ const m=(e&&e.message)||''; lab.err=isOfflineError(m)?'You appear to be offline.':isRateLimitError(m)?'The AI is busy right now. Wait a few seconds and try again.':(m||'Something went wrong.'); }
  lab.busy=false; labPaint(true);
}
async function labSaveGen(){
  const deck=(document.getElementById('fl-deck').value||'').trim()||'General';
  const ok=lab.gen.filter(c=>c.q.trim()&&(c.type==='cloze'||c.a.trim())); if(!ok.length) return labToast('Add at least one complete card first.');
  ok.forEach(c=>{ const a=c.type==='cloze'?(c.a||(c.q.match(/\{\{(.+?)\}\}/)||[])[1]||''):c.a; L().cards.push(newCard(deck,{type:c.type,q:c.q.trim(),a:a.trim(),ex:(c.ex||'').trim()})); });
  lab.gen=[]; lab.viewDeck=deck; lab.rdeck=deck; await saveState(); labToast(ok.length+' cards saved to '+deck); labGo(2);
}

/* ---------- tab 2: spaced repetition (SM-2) ---------- */
function labDue(d){ const e=new Date(); e.setHours(23,59,59,999); return L().cards.filter(c=>(!d||c.deck===d)&&c.due<=e.getTime()); }
function fmtIv(d){ return d<=0?'10m':d<30?d+'d':d<365?Math.round(d/30)+'mo':(d/365).toFixed(1)+'y'; }
function sm2(c,g){
  const e0=c.ease||2.5, iv=c.interval||0, n=c.reps||0;
  if(g===0) return {ease:Math.max(1.3,+(e0-.2).toFixed(2)),interval:0,reps:0,due:Date.now()+6e5,label:'10m'};
  const ease=Math.max(1.3,+(e0+[0,-.15,0,.15][g]).toFixed(2)); let d;
  if(n===0) d=[0,1,3,7][g]; else { const h=Math.max(1,Math.round(iv*1.2)), gd=Math.max(h+1,Math.round(iv*ease)), ez=Math.max(gd+1,Math.round(iv*ease*1.3)); d=[0,h,gd,ez][g]; }
  return {ease,interval:d,reps:n+1,due:Date.now()+d*864e5,label:fmtIv(d)};
}
function labReview(){
  const cards=L().cards; lab.decks=[...new Set(cards.map(c=>c.deck))];
  if(!lab.decks.length) return `<div class="lab-empty"><h3>No decks yet</h3><p>Generate cards from a note, or write some by hand. They will be waiting here, scheduled for the moment you are about to forget them.</p><button class="lbtn pri" onclick="labGo(1)">Open Active Recall</button></div>`;
  if(!lab.decks.includes(lab.rdeck)) lab.rdeck=lab.decks[0];
  const pills=lab.decks.map((d,i)=>`<button class="dpill${d===lab.rdeck?' on':''}" onclick="labDeck(${i})">${esc(d)}<b>${labDue(d).length} due</b></button>`).join('');
  const due=labDue(lab.rdeck).length;
  let main;
  if(lab.rev&&lab.q.length) main=labStage();
  else if(lab.rev) main=labDone();
  else { const next=cards.filter(c=>c.deck===lab.rdeck&&c.due>Date.now()).sort((a,b)=>a.due-b.due)[0], mins=next?Math.max(1,Math.round((next.due-Date.now())/6e4)):0;
    main=`<div class="lab-empty"><h3>${due?due+' card'+(due===1?'':'s')+' ready':'All caught up'}</h3><p>${due?'Flip each card, then rate how well you knew it. Intervals adapt to you.':(next?'Next card returns in '+(mins<90?mins+' minutes':mins<2880?Math.round(mins/60)+' hours':Math.round(mins/1440)+' days')+'.':'Nothing scheduled in this deck.')}</p><button class="lbtn pri" onclick="labStart()" ${due?'':'disabled'}>Start review</button></div>`; }
  return `<div class="rv"><div class="rv-top"><span>Cards due today</span><span class="due-badge">${due}</span></div><div>${pills}</div>${main}</div>`;
}
function labDeck(i){ lab.rdeck=lab.decks[i]; lab.rev=null; lab.q=[]; labPaint(true); }
function labStart(){ lab.q=labDue(lab.rdeck).sort((a,b)=>a.due-b.due).map(c=>c.id); lab.rev={done:0,total:lab.q.length}; lab.flip=false; labPaint(true); }
function labStage(){
  const c=L().cards.find(x=>x.id===lab.q[0]); if(!c){ lab.q.shift(); return labReviewSafe(); }
  const front=c.type==='cloze'?esc(c.q).replace(/\{\{(.+?)\}\}/g,'<span class="blank"></span>'):esc(c.q);
  const back=c.type==='cloze'?esc(c.q).replace(/\{\{(.+?)\}\}/g,'<mark class="ans">$1</mark>'):esc(c.a);
  const pct=Math.round(lab.rev.done/Math.max(1,lab.rev.done+lab.q.length)*100);
  return `<div class="rv-bar"><i style="width:${pct}%"></i></div><div class="fc-wrap" onclick="labFlip()"><div class="fc${lab.flip?' flip':''}" id="fc"><div class="fc-f"><div class="fc-kind">${c.type==='cloze'?'Fill in the blank':'Question'}</div><div class="fc-text">${front}</div><div class="fc-hint">Click or press Space to reveal</div></div><div class="fc-f fc-back"><div class="fc-kind">Answer</div><div class="fc-text">${back}</div>${c.ex?`<div class="fc-ex">${esc(c.ex)}</div>`:''}</div></div></div>
  <div class="rates${lab.flip?' show':''}" id="rates">${['Again','Hard','Good','Easy'].map((n,g)=>`<button class="rate r${g}" onclick="labRate(${g})"><span>${n}</span><code>${sm2(c,g).label}</code></button>`).join('')}</div>`;
}
function labReviewSafe(){ return lab.q.length?labStage():labDone(); }
function labDone(){ return `<div class="lab-empty"><h3>Deck complete</h3><p>${lab.rev.done} review${lab.rev.done===1?'':'s'} done. A star has been added to your ${esc(lab.rdeck)} constellation in the Observatory.</p><button class="lbtn pri" onclick="lab.rev=null;labPaint(true)">Back to decks</button></div>`; }
function labFlip(){ if(!lab.q.length) return; lab.flip=!lab.flip; const f=document.getElementById('fc'), r=document.getElementById('rates'); if(f) f.classList.toggle('flip',lab.flip); if(r) r.classList.toggle('show',lab.flip); }
async function labRate(g){
  if(!lab.flip) return; const c=L().cards.find(x=>x.id===lab.q[0]); if(!c) return;
  const r=sm2(c,g); c.ease=r.ease; c.interval=r.interval; c.reps=r.reps; c.due=r.due;
  lab.q.shift(); lab.rev.done++; if(g===0) lab.q.push(c.id); lab.flip=false;
  if(!lab.q.length) atlasBump(lab.rdeck,'decks');
  await saveState(); labPaint(true);
}

/* ---------- tab 3: feynman ---------- */
const FY_SYS=`You are a rigorous Feynman-technique coach. A student explained a concept in simple words. Return ONLY valid JSON, no prose: {"score":<integer 1-10 clarity and correctness>,"strengths":"1-2 sentences on what they explained well","jargon":[{"phrase":"exact words copied from the student's text","why":"what is unexplained or hand-waved"}],"gaps":[{"missing":"a key logical step or idea they skipped","hint":"a question that would push them to fill it"}]}. Speak directly to the student using 'you' (never 'the student'). Be honest: give 9 or 10 only if the explanation is clear, complete and correct for a 12-year-old. At most 4 jargon items and 4 gaps. If reference notes are provided, treat them as ground truth. Plain text only, no LaTeX.`;
function labFeynman(){
  const f=lab.fey, r=f.res, l=L();
  const opts='<option value="">No reference note</option>'+l.notes.map(n=>`<option value="${n.id}"${n.id===f.note?' selected':''}>${esc(n.subject)} · ${esc(n.title||'Untitled')}</option>`).join('');
  let right;
  if(f.busy) right='<div class="skel" style="width:30%;height:44px"></div><div class="skel"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:60%"></div>';
  else if(!r) right=`<h3 style="font-size:22px;margin-bottom:8px">Your audit</h3><p class="muted">Write your explanation, then audit it. You will get a clarity score, the exact phrases where you leaned on jargon, and the steps you skipped.</p>${f.err?`<div class="lab-err">${esc(f.err)}</div>`:''}`;
  else right=`<div class="fy-num">${r.score}<small>/10</small></div><div class="fy-bar"><i style="width:${r.score*10}%"></i></div><div class="muted" style="font-size:12px;font-family:var(--mono)">${f.rounds.map((s,i)=>'R'+(i+1)+' '+s).join('  →  ')}</div>
    <h4>Clarity and what worked</h4><p>${esc(r.strengths)}</p>
    <h4>Jargon and hand-waving flags</h4>${r.jargon.length?r.jargon.map(j=>`<div class="fy-flag"><q>${esc(j.phrase||'')}</q><span>${esc(j.why||'')}</span></div>`).join(''):'<p class="muted">No buzzwords left unexplained.</p>'}
    <h4>Missing steps and blind spots</h4>${r.gaps.length?r.gaps.map(j=>`<div class="fy-flag gap"><q>${esc(j.missing||'')}</q><span>${esc(j.hint||'')}</span></div>`).join(''):'<p class="muted">No major gaps found.</p>'}
    <div style="margin-top:18px">${r.score>=9?'<p style="margin-bottom:12px"><b>Target reached.</b> This explanation holds up.</p><button class="lbtn pri" onclick="fyReset()">Try another concept</button>':'<button class="lbtn pri" onclick="fyRefine()">Refine Explanation</button>'}</div>${f.err?`<div class="lab-err">${esc(f.err)}</div>`:''}`;

    <label class="lf">Concept<input class="lin" value="${esc(f.concept)}" oninput="lab.fey.concept=this.value" placeholder="e.g. How vaccines train the immune system"></label>
    <label class="lf">Reference note (optional)<select class="lin" onchange="lab.fey.note=this.value">${opts}</select></label>
    <label class="lf">Explain it in plain words, as if teaching a 12-year-old<textarea id="fy-text" class="lin" rows="11" oninput="lab.fey.text=this.value" placeholder="Start with the big idea, then walk through how it works, step by step.">${esc(f.text)}</textarea></label>
    <button class="lbtn pri" onclick="fyAudit()" ${f.busy?'disabled':''}>${f.busy?'Auditing…':'Audit My Understanding'}</button></div><div>${right}</div></div>`;
}
async function fyAudit(){
  const f=lab.fey; if(wc(f.text)<15){ f.err='Write a fuller explanation first, at least a few sentences.'; return labPaint(true); }
  f.busy=true; f.err=''; labPaint(true); const note=L().notes.find(n=>n.id===f.note);

    const r=await callGemini(FY_SYS,`Concept: ${f.concept||'(not named)'}\n${note?'Reference notes:\n'+note.body.slice(0,3500)+'\n':''}\nStudent explanation:\n${f.text.slice(0,3500)}`);
    if(r.score===undefined) throw new Error('The audit came back in an unreadable format. Please try again.');

const STOP=new Set('about above after again against because before being below between both could does doing down during each from further have having here itself just more most other over same should some such than that their them then there these they this those through under until very were what when where which while with would your into also been will can its the and for are but not you all any use used using called make makes made many much only like'.split(' '));

    ${b.ai?`<div class="crow"><h4>AI diff</h4>${b.ai.missed.length?'<p style="font-size:13.5px"><b>Ideas you missed:</b></p><ul style="margin:4px 0;font-size:13.5px;line-height:1.6">'+b.ai.missed.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}${b.ai.wrong.length?'<p style="font-size:13.5px"><b>Check these:</b></p><ul style="margin:4px 0;font-size:13.5px;line-height:1.6">'+b.ai.wrong.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}${!b.ai.missed.length&&!b.ai.wrong.length?'<p class="muted">The AI found nothing important missing.</p>':''}</div>`:''}</div>`;

async function saveClass(id){

  const flush=()=>{ if(run.length) runs.push(run); run=[]; };

    r.forEach((x,i)=>{ const k=w[i]; if(k.length>=5||/^[A-Z]{2,6}$/.test(x)) sc[k]=(sc[k]||0)+1+(/^[A-Z]/.test(x)?.4:0)+(k.length>8?.4:0); });
    for(let i=0;i+2<=w.length;i++){ const p=w.slice(i,i+2).join(' '); sc[p]=(sc[p]||0)+1.7; } });
  const total=(txt.match(/\S+/g)||[]).length, N=Math.min(24,Math.max(6,Math.round(total/10))), out=[];

  Object.entries(sc).sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length).forEach(([k])=>{ if(out.length>=N) return; if(out.some(o=>has(o,k)||has(k,o)||share(o,k))) return; out.push(k); });

const termPat=t=>t.split(' ').map(w=>reEsc(stem(w))+'\\w*').join('[\\s\\-]+');

  cv.addEventListener('pointerleave',()=>{ obs.px=obs.py=-1; obs.tmx=obs.tmy=0; });
  cv.addEventListener('pointerdown',()=>{ obs.pinned=obs.hover?(obs.pinned===obs.hover?'':obs.hover):''; obs.pinX=obs.px; obs.pinY=obs.py; obs.tipKey='x'; });

function obsDrawerToggle(){ obs.drawer=!obs.drawer; obsDrawer(); }
function obsDrawer(){
